<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choidorj Bayarkhuu — undergraduate at UCLA studying Computer Science." />
    <meta name="theme-color" content="#fbf1c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Choi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Choidorj Bayarkhuu</title>

    <link
      rel="preload"
      href="/fonts/MonaspaceNeon-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Resolve theme before React paints to avoid a flash of wrong colors.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
